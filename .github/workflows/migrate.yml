name: Apply Supabase migrations

# Applies any new files in supabase/migrations/ to the flappybid project.
# Needs two repo secrets:
#   SUPABASE_ACCESS_TOKEN — supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  — the project's database password
#   SUPABASE_PROJECT_REF  — the target project's ref (dashboard URL)
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      # 0001 is the consolidated schema: the 35 incremental migrations this
      # project was built through, collapsed into one file. A database that
      # already ran the original chain has every one of those versions in its
      # ledger, so push finds nothing new and leaves it alone. Baselining 0001
      # keeps a hand-loaded database from re-running it.
      - name: Baseline the consolidated schema
        run: supabase migration repair --status applied 0001 || true
      - name: Apply new migrations
        run: supabase db push
